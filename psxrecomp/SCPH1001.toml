# SCPH-1001 (US, v2.2 12/04/95) — the reference BIOS.
# Boot + kernel + shell all recompiled from ROM.

[program]
name = "SCPH1001 BIOS"
id = "SCPH-1001"
rom = "bios/US-PSX-SCPH1001.BIN"
load_address = "0xBFC00000"
entry_pc = "0xBFC00000"
text_size = "0x80000"

[recompiler]
seeds = "recompiler/seeds/phase2_ghidra_seeds.json"
out_dir = "generated"
out_stem = "SCPH1001"
strict = true

# A0 table: 0xC1 entries copied from ROM 0xBFC04300 to RAM 0x200
[[recompiler.bios_vectors]]
ram_addr = "0xA0"
index_reg = 9
table_rom_addr = "0xBFC04300"
table_count = 0xC1
table_ram_addr = "0x200"

# B0 table: 0x44 entries at kernel 0x874 (ROM 0xBFC10874)
[[recompiler.bios_vectors]]
ram_addr = "0xB0"
index_reg = 9
table_rom_addr = "0xBFC10874"
table_count = 0x44
table_ram_addr = "0x874"

# C0 table: 0x1E entries at kernel 0x674 (ROM 0xBFC10674)
[[recompiler.bios_vectors]]
ram_addr = "0xC0"
index_reg = 9
table_rom_addr = "0xBFC10674"
table_count = 0x1E
table_ram_addr = "0x674"

# SIO data-byte handler: 4-instruction trampoline at RAM 0xCF0 -> func 0x641C
[[recompiler.bios_aliases]]
ram_addr = "0xCF0"
target_key = "0x641C"
