name = "TTT Hitspark (64x64)"
description = "Strong hits show each character's TTT1 effect in 64x64, the same size on screen, finer. Does nothing until the TTT1 characters are imported. Restart after changing."
group = "Visual Enhancements"
default_enabled = true

[[plugin]]
