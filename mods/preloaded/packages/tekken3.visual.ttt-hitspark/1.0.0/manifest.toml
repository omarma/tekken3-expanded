name = "TTT Hitspark"
author = "Tekken3Recomp"
description = "Every fighter's strong-hit effect from Tekken Tag Tournament at its arcade resolution, 64x64 instead of the PS1's 32x32: the TTT1 guests' and Tekken 3's own cast's (Jin's red lightning included; not Gon's nor Dr. B's, who are not in TTT1). Made from your TTT1 ROM by the setup. OpenGL and software renderers."
