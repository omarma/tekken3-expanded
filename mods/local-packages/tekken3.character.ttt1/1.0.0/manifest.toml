format_version = 5
id = "tekken3.character.ttt1"
version = "1.0.0"
name = "TTT1 Characters"
author = "Tekken3Recomp"
description = "Adds the Tekken Tag Tournament characters missing from Tekken 3 as a guest fighter, with their arcade model, moves, voices and interface. Requires the characters imported locally from your own TTT1 ROM."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00402"
exe_sha256 = "fbda8b68e5799dbef4af39a161783bc670c15b0aa0e87dce65e210717da19b8c"

[[feature]]
id = "ttt1-characters"
name = "TTT1 Characters"
description = "Adds the imported TTT1 characters as characters of their own. At the character selector, R2 / L2 switch between the Tekken 3 grid and the Tag page of guests; player 1 and player 2 can fight with two different guests. Team Battle offers one guest cell. Tag mechanics are excluded."
group = "Characters"
default_enabled = true

[[plugin]]
feature = "ttt1-characters"
id = "tekken3.ttt1-characters"

[[feature]]
id = "ttt1-embu"
name = "Embu TTT"
description = "The attract-mode Embu (the dojo kata demo) played by TTT1 guests instead of the Tekken 3 cast: each native keeps his choreography and camera, the chosen guest takes his place. Needs TTT1 Characters."
group = "Characters"
default_enabled = true

[[plugin]]
feature = "ttt1-embu"
id = "tekken3.ttt1-embu"

[[option]]
feature = "ttt1-embu"
id = "hwoarang"
label = "Hwoarang"
description = "Who plays Hwoarang's part in the Embu."
group = "Characters"
type = "choice"
default = "baek"
choice = [
    { value = "none", label = "Original" },
    { value = "kazuya", label = "Kazuya" },
