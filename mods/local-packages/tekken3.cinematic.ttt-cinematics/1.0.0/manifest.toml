description = "Cinematics from Tekken Tag Tournament (PS2) in the Tekken 3 engine: TTT endings in place of the Arcade ending movies, and TTT's Embu in the attract. Needs TTT1 Characters and the setup's TTT Cinematics option."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00402"
