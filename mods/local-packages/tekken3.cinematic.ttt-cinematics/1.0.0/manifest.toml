[[feature]]
id = "ttt-cinematics"
name = "TTT Cinematics"
description = "When Kazuya, Armor King, Michelle, Baek, Kunimitsu or Angel (TTT1 guests) clears the Arcade as player 1, their Tekken Tag Tournament ending plays instead of the ending movie, on its TTT stage when TTT Stages is installed; TTT's Embu replaces one Tekken 3 Embu in two in the attract. With the music of TTT's endings when the setup was given your Tekken Tag Tournament PS2 disc, otherwise with a piece of Tekken 3's music. Does nothing until the setup has prepared it."
group = "Characters"
default_enabled = true

[[plugin]]
